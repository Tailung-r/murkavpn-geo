name: update-geo
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download
        run: |
          mkdir -p geo
          base=https://raw.githubusercontent.com/nehamoff/IndieVPN-GEO/main
          curl -fL -o geo/geoip.dat   $base/geoip.dat
          curl -fL -o geo/geosite.dat $base/geosite.dat
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add geo
          git diff --cached --quiet || git commit -m "update geo $(date -u +%F_%H%M)"
          git push
