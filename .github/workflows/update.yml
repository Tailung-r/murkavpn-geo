name: update-geo
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          base=https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release
          curl -fL -o geoip.dat   $base/geoip.dat
          curl -fL -o geosite.dat $base/geosite.dat
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add geoip.dat geosite.dat
          git diff --cached --quiet || git commit -m "update geo $(date -u +%F_%H%M)"
          git push
