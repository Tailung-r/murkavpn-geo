name: update-geo
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download
        run: |
          mkdir -p lite
          base=https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release
          curl -fL -o lite/geoip.dat   $base/geoip.dat
          curl -fL -o lite/geosite.dat $base/geosite.dat
      - name: Keep only categories used by the profile
        run: node scripts/trim.js profiles/murka-smart-ru.json lite/geoip.dat lite/geosite.dat
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add lite
          git diff --cached --quiet || git commit -m "update geo $(date -u +%F_%H%M)"
          git push
